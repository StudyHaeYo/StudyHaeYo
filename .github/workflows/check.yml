name: check

# PR마다 AGENTS.md의 검사를 돌린다: 타입, 색 토큰, 계산 테스트. 빌드는 Vercel 미리보기가 한다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm run check:colors
      - run: pnpm test
